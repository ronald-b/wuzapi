networks:
  dokploy-network:
    external: true

volumes:
  wuzapi_db_data:
  wuzapi_rabbitmq_data:

services:
  wuzapi-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wuzapi
    restart: always
    ports:
      - "8181:8080"
    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - DB_USER=rsend_wuzapi_usr
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=rsend_wuzapi_prod_db
      - DB_HOST=db
      - DB_PORT=5432
      - TZ=America/Sao_Paulo
      - WEBHOOK_FORMAT=json
      - LOG_LEVEL=error
      - RABBITMQ_URL=amqp://rsend_wuzapi_mq_usr:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - RABBITMQ_QUEUE=whatsapp_events
      - WEBHOOK_RETRY_ENABLED=true
      - WEBHOOK_RETRY_COUNT=10
      - WEBHOOK_RETRY_DELAY_SECONDS=30
      - WEBHOOK_ERROR_QUEUE_NAME=wuzapi_dead_letter_webhooks
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dokploy-network

  db:
    image: postgres:17.2
    container_name: postgreswuzapi
    restart: always
    environment:
      POSTGRES_USER: rsend_wuzapi_usr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rsend_wuzapi_prod_db
    volumes:
      - wuzapi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsend_wuzapi_usr"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmqwuzapi
    restart: always
    expose:
      - "5672"
      - "15672"                    # management UI — configure domínio no Dokploy se precisar acessar
    environment:
      RABBITMQ_DEFAULT_USER: rsend_wuzapi_mq_usr
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - wuzapi_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
